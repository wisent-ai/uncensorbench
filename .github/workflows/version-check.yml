name: Version check

# Refuse a change whose declared version disagrees with what the change did
# to this distribution's public surface.
#
# Stado owns the gate. `stado release version-gate app-surface` reads the
# surface statically from the sources named below, never by importing the
# package: the `__all__` of uncensorbench/__init__.py (`api:`), the
# subcommands uncensorbench/cli/commands.py registers with a help text
# (`cli:`) and the console scripts of pyproject.toml (`console-script:`),
# whose `[project]` version is the declared version. `app-baseline --stdout`
# reads the same sources from the newest version tag origin serves, which is
# the tree the PyPI release was built from; `decide` is the shared rule and
# `conformance` proves it against the shared fixtures before any verdict is
# trusted.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCES: --pyproject pyproject.toml --python-all uncensorbench/__init__.py --python-argparse uncensorbench/cli/commands.py

jobs:
  version-check:
    runs-on: [self-hosted, macOS, stado]
    steps:
      - uses: actions/checkout@v4

      # actions/checkout fetches one commit and no tags; the baseline is read
      # from the released tag's blobs. Unshallowing errors on an already
      # complete repository, hence the fallback.
      - name: Make tags and history visible
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      - name: Prove the versioning rule against the shared fixtures
        run: stado release version-gate conformance

      - name: Compare the surface against the released tag
        run: |
          set -euo pipefail
          stado release version-gate app-baseline --root . $SOURCES --stdout > "$RUNNER_TEMP/released.json"
          stado release version-gate app-surface --root . $SOURCES > "$RUNNER_TEMP/candidate.json"
          released="$(jq -r .version "$RUNNER_TEMP/released.json")"
          declared="$(jq -r .version "$RUNNER_TEMP/candidate.json")"
          echo "released: $released ($(jq -r '.source | split(" ") | first' "$RUNNER_TEMP/released.json"))"
          echo "declared: $declared"
          verdict="$(stado release version-gate decide --json \
            --current "$released" \
            --published-surface "$RUNNER_TEMP/released.json" \
            --candidate-surface "$RUNNER_TEMP/candidate.json")"
          echo "$verdict"
          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"
          if [ "$declared" = "$released" ]; then
            if [ "$change" != internal ]; then
              echo "::error::the surface changed ($change) but pyproject.toml still declares $released; the next version must be $required."
              false
            fi
            echo "pyproject.toml remains $released and the surface is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::pyproject.toml declares $declared, but a $change change to $released requires $required."
            false
          else
            echo "pyproject.toml $declared matches the $change change."
          fi
