name: version-check

# Refuse a change whose public surface has outgrown the version the product
# declares. The rule itself lives in lbartoszcze/AutoVersion and is installed,
# never vendored; this workflow supplies only the two things the product knows:
# its surface (the embedded surface extractor) and the version it declares (pyproject.toml).
#
# released-surface.json is frozen and committed. It is never rewritten here:
# recomputing both sides at check time is the one shape that cannot refuse
# anything.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version-check implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/version-check"
          cat > "$RUNNER_TEMP/version-check/surface.py" <<'PYTHON'
          """Print the public surface of the ``uncensorbench`` distribution.
          
          Why this set is the contract
          ----------------------------
          ``uncensorbench`` is published to PyPI as a single distribution that is three
          products at once, and a consumer can hold any of the three:
          
          * a **library** -- ``from uncensorbench import UncensorBench``;
          * a **console script** -- ``uncensorbench`` is declared in ``[project.scripts]``,
            so a rename breaks a shell script that ran yesterday;
          * a **command-line tool** -- the subcommands its ``--help`` advertises.
          
          So the surface is the union of four namespaced families:
          
          ``api:<Name>``            an entry of ``uncensorbench.__all__``.
          ``api:<Class>.<member>``  a public member of an exported class: a method, a
                                    dataclass field, or an enum member. Counting only the
                                    class names would call ``UncensorBench.evaluate``
                                    internal, and deleting it is plainly a removal --
                                    this is the "include a set whose removal your surface
                                    would otherwise call internal" rule from ADOPTING.md.
          ``cli:<command>``         a subcommand registered with a ``help=`` text, i.e.
                                    one the tool's own help *advertises*. A subparser
                                    added without ``help=`` dispatches but is unlisted,
                                    and unlisted means private.
          ``console-script:<name>`` a console script name from the packaging metadata.
          
          Deliberately excluded: option flags (argparse detail that churns), the prompt
          and topic JSON payloads (data the benchmark is expected to grow), and anything
          underscore-prefixed.
          
          Everything is read statically with ``ast``. The package is never imported: a
          release decision must not require a machine that can import ``torch``, and the
          same reader has to run against an unpacked published sdist or wheel, which is
          how ``released-surface.json`` is recovered rather than assumed.
          
          A module that fails to parse is a hard error. Skipping it would report a
          shorter surface, and a shorter surface reads as removed capability -- a false
          ``breaking`` verdict for an unrelated syntax error. ``--tolerant`` downgrades
          that to a warning and is meant only for recovering an already-published
          artifact; it names every module it skipped on stderr.
          """
          
          from __future__ import annotations
          
          import argparse
          import ast
          import configparser
          import json
          import sys
          
          try:
              import tomllib
          except ImportError as exc:  # pragma: no cover - depends on the interpreter
              raise SystemExit(
                  "surface.py needs an interpreter with tomllib in the standard library"
                  " to read pyproject.toml; this one has none (" + str(exc) + ")"
              )
          
          from pathlib import Path
          
          API = "api:"
          CLI = "cli:"
          SCRIPT = "console-script:"
          
          CONSOLE_SCRIPTS_SECTION = "console_scripts"
          SUBPARSER_FACTORY = "add_subparsers"
          SUBPARSER_ADD = "add_parser"
          
          
          def fail(message):
              raise SystemExit("surface.py: " + message)
          
          
          def parse_module(path, tolerant):
              try:
                  return ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  if tolerant:
                      print(
                          "surface.py: skipping unparsable module " + str(path) + ": " + str(exc),
                          file=sys.stderr,
                      )
                      return None
                  fail(
                      str(path)
                      + " does not parse ("
                      + str(exc)
                      + "); the surface there is unknown, not smaller"
                  )
              except OSError as exc:
                  fail("cannot read " + str(path) + ": " + str(exc))
          
          
          def read_pyproject(root):
              manifest = root / "pyproject.toml"
              if not manifest.is_file():
                  return {}
              with manifest.open("rb") as handle:
                  return tomllib.load(handle)
          
          
          def project_name(root):
              """The distribution name as the manifest declares it.
          
              Taken from the manifest, never spelled as a literal at a call site: a
              renamed distribution must make every lookup follow, rather than leave a
              gate happily validating somebody else's project.
              """
              return read_pyproject(root).get("project", {}).get("name")
          
          
          def entry_points_files(root):
              for pattern in ("*.dist-info/entry_points.txt", "*.egg-info/entry_points.txt"):
                  yield from sorted(root.glob(pattern))
          
          
          def console_scripts(root):
              """Console script name -> ``module:attr`` target.
          
              ``[project.scripts]`` in ``pyproject.toml`` is authoritative when present.
              A wheel carries no manifest, so fall back to
              ``<dist>.dist-info/entry_points.txt`` under ``[console_scripts]``.
              """
              scripts = read_pyproject(root).get("project", {}).get("scripts")
              if scripts:
                  return dict(scripts)
              for path in entry_points_files(root):
                  parser = configparser.ConfigParser()
                  parser.read(path, encoding="utf-8")
                  if parser.has_section(CONSOLE_SCRIPTS_SECTION):
                      return dict(parser.items(CONSOLE_SCRIPTS_SECTION))
              return {}
          
          
          def resolve_package(root, override):
              if override:
                  return override
              name = project_name(root)
              if name:
                  return name.replace("-", "_").replace(".", "_")
              for path in sorted(root.glob("*.dist-info/top_level.txt")):
                  named = [line.strip() for line in path.read_text(encoding="utf-8").split("\n")]
                  named = [line for line in named if line]
                  if named:
                      return next(iter(named))
              fail(
                  "cannot determine the package name under "
                  + str(root)
                  + "; pass --package explicitly"
              )
          
          
          def dunder_all(tree, path):
              for node in tree.body:
                  targets = []
                  if isinstance(node, ast.Assign):
                      targets = node.targets
                  elif isinstance(node, ast.AnnAssign):
                      targets = [node.target]
                  if not any(isinstance(t, ast.Name) and t.id == "__all__" for t in targets):
                      continue
                  value = node.value
                  if not isinstance(value, (ast.List, ast.Tuple)):
                      fail(str(path) + " defines __all__ as a non-literal; cannot read it")
                  names = []
                  for element in value.elts:
                      if not isinstance(element, ast.Constant) or not isinstance(
                          element.value, str
                      ):
                          fail(str(path) + " has a non-string entry in __all__")
                      names.append(element.value)
                  return names
              fail(str(path) + " defines no __all__, so the library contract is undeclared")
          
          
          def relative_imports(tree):
              """Exported name -> the sibling module it is imported from."""
              origin = {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.level and node.module:
                      for alias in node.names:
                          origin[alias.asname or alias.name] = node.module
              return origin
          
          
          def class_members(node):
              """Public methods, dataclass fields and enum members declared on a class."""
              members = []
              for child in node.body:
                  if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if not child.name.startswith("_"):
                          members.append(child.name)
                  elif isinstance(child, ast.AnnAssign):
                      target = child.target
                      if isinstance(target, ast.Name) and not target.id.startswith("_"):
                          members.append(target.id)
                  elif isinstance(child, ast.Assign):
                      for target in child.targets:
                          if isinstance(target, ast.Name) and not target.id.startswith("_"):
                              members.append(target.id)
              return members
          
          
          def module_classes(tree):
              return {n.name: n for n in tree.body if isinstance(n, ast.ClassDef)}
          
          
          def cli_commands(path, tolerant):
              """Subcommands the tool's help advertises: ``add_parser`` calls with ``help=``.
          
              The receiver must be a name bound to an ``add_subparsers()`` result, so an
              ``add_parser`` on some unrelated object is not mistaken for a command.
              """
              if not path.is_file():
                  if tolerant:
                      print("surface.py: missing cli module " + str(path), file=sys.stderr)
                      return []
                  fail("the console script points at a missing module " + str(path))
              tree = parse_module(path, tolerant)
              if tree is None:
                  return []
              holders = set()
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Assign) or not isinstance(node.value, ast.Call):
                      continue
                  func = node.value.func
                  if isinstance(func, ast.Attribute) and func.attr == SUBPARSER_FACTORY:
                      for target in node.targets:
                          if isinstance(target, ast.Name):
                              holders.add(target.id)
              commands = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  if not isinstance(func, ast.Attribute) or func.attr != SUBPARSER_ADD:
                      continue
                  if not isinstance(func.value, ast.Name) or func.value.id not in holders:
                      continue
                  if not node.args:
                      continue
                  first = next(iter(node.args))
                  if not isinstance(first, ast.Constant) or not isinstance(first.value, str):
                      continue
                  if any(keyword.arg == "help" for keyword in node.keywords):
                      commands.append(first.value)
              return commands
          
          
          def collect(root, package, tolerant):
              package_dir = root / package
              if not package_dir.is_dir():
                  fail("no package directory at " + str(package_dir))
              init = package_dir / "__init__.py"
              if not init.is_file():
                  fail("no " + str(init))
          
              tree = parse_module(init, tolerant)
              if tree is None:
                  fail(str(init) + " does not parse; the whole contract is unknown")
          
              exported = dunder_all(tree, init)
              origin = relative_imports(tree)
          
              parsed = {}
              for name in exported:
                  module = origin.get(name)
                  if module is None or module in parsed:
                      continue
                  module_path = package_dir / (module.replace(".", "/") + ".py")
                  if not module_path.is_file():
                      if tolerant:
                          print("surface.py: missing module " + str(module_path), file=sys.stderr)
                          parsed[module] = None
                          continue
                      fail("__all__ names " + name + " from a missing module " + str(module_path))
                  parsed[module] = parse_module(module_path, tolerant)
          
              surface = set()
              for name in exported:
                  surface.add(API + name)
                  tree_for = parsed.get(origin.get(name))
                  if tree_for is None:
                      continue
                  node = module_classes(tree_for).get(name)
                  if node is None:
                      continue
                  for member in class_members(node):
                      surface.add(API + name + "." + member)
          
              for script, target in console_scripts(root).items():
                  surface.add(SCRIPT + script)
                  module, separator, _attribute = target.partition(":")
                  if not separator:
                      continue
                  head, _dot, tail = module.strip().partition(".")
                  if head != package or not tail:
                      continue
                  for command in cli_commands(
                      package_dir / (tail.replace(".", "/") + ".py"), tolerant
                  ):
                      surface.add(CLI + command)
          
              return sorted(surface)
          
          
          def main():
              here = Path(__file__).resolve().parent
              parser = argparse.ArgumentParser(
                  description="Print the public surface of the uncensorbench distribution."
              )
              parser.add_argument(
                  "--root",
                  type=Path,
                  default=here.parent,
                  help="tree to read: the repository, or an unpacked sdist or wheel",
              )
              parser.add_argument("--package", help="import package name; inferred by default")
              parser.add_argument(
                  "--tolerant",
                  action="store_true",
                  help="warn instead of failing on an unparsable module (recovery only)",
              )
              args = parser.parse_args()
          
              root = args.root.resolve()
              if not root.is_dir():
                  fail("no such tree: " + str(root))
              package = resolve_package(root, args.package)
              print(json.dumps({"surface": collect(root, package, args.tolerant)}, indent="  "))
          
          
          if __name__ == "__main__":
              main()
          PYTHON
          cat > "$RUNNER_TEMP/version-check/baseline.py" <<'PYTHON'
          """Generate ``released-surface.json`` from the best reachable artifact.
          
          The baseline describes the version **actually published**, never the version
          ``pyproject.toml`` declares. The moment somebody bumps ahead of a release,
          looking up the declared version returns nothing and a naive generator degrades
          to ``head:<sha>``, throwing away the real published baseline -- after which
          every later comparison is measured against the wrong artifact, quietly. So the
          registry is asked what the newest published version is, and *that* version's
          artifact is recovered.
          
          Tier preference, best first (ADOPTING.md):
          
              pypi-sdist:<filename>    a published sdist
              pypi-wheel:<filename>    a published wheel
              gh-release:<tag>         an asset on a GitHub Release
              git-archive:<tag>        a tag, reproduced with git archive
              head:<full sha>          the working revision -- last resort
          
          ``--claims-pypi <marker>`` answers whether a marker asserts a PyPI release, so
          the workflow's bidirectional honesty guard and this generator agree through a
          named constant instead of through prose that drifts.
          
          Every absence here is read from the answer's *content*, in three states --
          named, stated-absent, unproven -- because a client that could not reach the
          index fails exactly like one that reached it and found nothing, and the wrong
          reading is the passing one. Each lookup is paired with a positive control run
          through the same URL spelling against a project the index certainly serves, so
          a broken expression blames the check rather than the registry.
          """
          
          from __future__ import annotations
          
          import argparse
          import ast
          import json
          import os
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path
          
          import surface
          
          PYPI_JSON = "https://pypi.org/pypi/{project}/json"
          CONTROL_PROJECT = "pip"
          
          SDIST_TIER = "pypi-sdist"
          WHEEL_TIER = "pypi-wheel"
          GH_RELEASE_TIER = "gh-release"
          GIT_ARCHIVE_TIER = "git-archive"
          HEAD_TIER = "head"
          
          #: Markers asserting "this exact version is served by PyPI". Every other tier
          #: asserts the opposite -- that PyPI serves this project not at all -- because
          #: any PyPI release would outrank it.
          PYPI_TIERS = (SDIST_TIER, WHEEL_TIER)
          
          KNOWN_TIERS = (
              SDIST_TIER,
              WHEEL_TIER,
              GH_RELEASE_TIER,
              GIT_ARCHIVE_TIER,
              HEAD_TIER,
          )
          
          SDIST_PACKAGETYPE = "sdist"
          WHEEL_PACKAGETYPE = "bdist_wheel"
          
          HTTP_TIMEOUT = float(os.environ.get("AUTOVERSION_HTTP_TIMEOUT", "30"))
          USER_AGENT = "uncensorbench-version-check (+https://github.com/wisent-ai/uncensorbench)"
          
          PUBLISHED = "published"
          ABSENT = "absent"
          UNPROVEN = "unproven"
          
          
          def fail(message):
              raise SystemExit("baseline.py: " + message)
          
          
          def fetch(url):
              """Return the response body, or None if no answer arrived at all."""
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              try:
                  with urllib.request.urlopen(request, timeout=HTTP_TIMEOUT) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  try:
                      return exc.read().decode("utf-8", errors="replace")
                  except OSError:
                      return None
              except (urllib.error.URLError, OSError, ValueError):
                  return None
          
          
          def read_pypi(project):
              """Three states for a PyPI lookup, decided by the answer's content."""
              body = fetch(PYPI_JSON.format(project=project))
              if body is None:
                  return UNPROVEN, None
              try:
                  document = json.loads(body)
              except ValueError:
                  return UNPROVEN, None
              if isinstance(document, dict) and document.get("info", {}).get("name"):
                  return PUBLISHED, document
              message = ""
              if isinstance(document, dict):
                  message = str(document.get("message", ""))
              if "not found" in message.lower():
                  return ABSENT, None
              return UNPROVEN, None
          
          
          def assert_control():
              """The same lookup, same spelling, against a project PyPI certainly serves."""
              state, _document = read_pypi(CONTROL_PROJECT)
              if state != PUBLISHED:
                  fail(
                      "the PyPI lookup cannot recognise '"
                      + CONTROL_PROJECT
                      + "', a project the index definitely serves, so this check is broken"
                      " and its verdict about anything else is meaningless"
                  )
          
          
          def resolve_project(root):
              name = surface.project_name(root)
              if not name:
                  fail(
                      "pyproject.toml declares no [project] name, so there is no subject to"
                      " look up; a lookup of an empty name reads as proven absence, which"
                      " is exactly the lie this generator must not tell"
                  )
              return name
          
          
          def download(url, destination):
              body_request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              try:
                  with urllib.request.urlopen(body_request, timeout=HTTP_TIMEOUT) as response:
                      destination.write_bytes(response.read())
              except (urllib.error.URLError, OSError) as exc:
                  fail("cannot download " + url + ": " + str(exc))
          
          
          def sole_child(directory):
              entries = [path for path in sorted(directory.iterdir()) if path.is_dir()]
              if not entries:
                  fail("the unpacked artifact under " + str(directory) + " has no tree in it")
              return next(iter(entries))
          
          
          def unpack_sdist(archive, workdir):
              with tarfile.open(archive) as handle:
                  handle.extractall(workdir, filter="data")
              return sole_child(workdir)
          
          
          def unpack_wheel(archive, workdir):
              with zipfile.ZipFile(archive) as handle:
                  handle.extractall(workdir)
              return workdir
          
          
          def declared_version(root):
              return surface.read_pyproject(root).get("project", {}).get("version")
          
          
          def recover_from_pypi(document, workdir):
              """Recover the newest published version's surface, sdist preferred."""
              version = document["info"]["version"]
              files = document.get("urls", [])
              chosen = None
              for packagetype, tier in ((SDIST_PACKAGETYPE, SDIST_TIER), (WHEEL_PACKAGETYPE, WHEEL_TIER)):
                  for entry in files:
                      if entry.get("packagetype") == packagetype:
                          chosen = (tier, entry)
                          break
                  if chosen:
                      break
              if chosen is None:
                  fail(
                      "PyPI serves "
                      + version
                      + " but neither an sdist nor a wheel, so no artifact can be unpacked"
                  )
              tier, entry = chosen
              filename = entry["filename"]
              archive = workdir / filename
              download(entry["url"], archive)
              unpacked = workdir / "unpacked"
              unpacked.mkdir()
              if tier == SDIST_TIER:
                  tree = unpack_sdist(archive, unpacked)
                  inside = declared_version(tree)
                  if inside != version:
                      fail(
                          "the sdist for "
                          + version
                          + " declares "
                          + str(inside)
                          + " inside; the artifact disagrees with the release it is filed under"
                      )
              else:
                  tree = unpack_wheel(archive, unpacked)
              package = surface.resolve_package(tree, None)
              names = surface.collect(tree, package, True)
              marker = tier + ":" + filename
              prose = "recovered from the PyPI release of " + version
              return {"version": version, "source": marker + " " + prose, "surface": names}
          
          
          def git(root, *arguments):
              result = subprocess.run(
                  ("git", *arguments),
                  cwd=str(root),
                  capture_output=True,
                  text=True,
                  check=False,
              )
              return result.returncode, result.stdout.strip(), result.stderr.strip()
          
          
          def version_key(text):
              parts = text.lstrip("vV").split(".")
              key = []
              for part in parts:
                  digits = ""
                  for character in part:
                      if character.isdigit():
                          digits += character
                      else:
                          break
                  if not digits:
                      return None
                  key.append(int(digits))
              return tuple(key) if key else None
          
          
          def best_tag(root):
              """The highest tag whose tree really declares the version the tag claims."""
              code, output, _err = git(root, "tag", "--list")
              if code:
                  return None
              candidates = []
              for tag in output.split("\n"):
                  tag = tag.strip()
                  if not tag:
                      continue
                  key = version_key(tag)
                  if key is None:
                      continue
                  candidates.append((key, tag))
              for key, tag in sorted(candidates, reverse=True):
                  with tempfile.TemporaryDirectory() as scratch:
                      scratch_path = Path(scratch)
                      archive = scratch_path / "tag.tar"
                      code, _out, _err = git(root, "archive", "--output", str(archive), tag)
                      if code:
                          continue
                      tree = scratch_path / "tree"
                      tree.mkdir()
                      with tarfile.open(archive) as handle:
                          handle.extractall(tree, filter="data")
                      inside = declared_version(tree)
                      claimed = tag.lstrip("vV")
                      if inside != claimed:
                          print(
                              "baseline.py: tag "
                              + tag
                              + " points at a tree declaring "
                              + str(inside)
                              + "; skipping it rather than filing it under "
                              + claimed,
                              file=sys.stderr,
                          )
                          continue
                      package = surface.resolve_package(tree, None)
                      names = surface.collect(tree, package, True)
                      return {
                          "version": claimed,
                          "source": GIT_ARCHIVE_TIER
                          + ":"
                          + tag
                          + " reproduced with git archive; nothing is served by PyPI",
                          "surface": names,
                      }
              return None
          
          
          def gh_releases_present(root):
              code, output, _err = git(root, "config", "--get", "remote.origin.url")
              if code or not output:
                  return False
              trimmed = output.removesuffix(".git")
              prefix, _slash, name = trimmed.rpartition("/")
              _root, _sep, owner = prefix.rpartition("/")
              _host, _colon, owner = owner.rpartition(":")
              if not name or not owner:
                  return False
              api = "https://api.github.com/repos/" + owner + "/" + name + "/releases"
              body = fetch(api)
              if body is None:
                  fail(
                      "the GitHub releases API did not answer, so the absence of a"
                      " gh-release tier is unproven"
                  )
              try:
                  document = json.loads(body)
              except ValueError:
                  fail("the GitHub releases API returned no JSON; the gh-release tier is unproven")
              return isinstance(document, list) and bool(document)
          
          
          def head_baseline(root):
              code, sha, _err = git(root, "rev-parse", "HEAD")
              if code or not sha:
                  fail("cannot resolve HEAD, and there is no lower tier than head:")
              package = surface.resolve_package(root, None)
              names = surface.collect(root, package, False)
              return {
                  "version": str(declared_version(root)),
                  "source": HEAD_TIER
                  + ":"
                  + sha
                  + " the working revision; nothing is served by PyPI and no tag qualifies",
                  "surface": names,
              }
          
          
          def generate(root):
              project = resolve_project(root)
              state, document = read_pypi(project)
              assert_control()
              if state == UNPROVEN:
                  fail(
                      "PyPI neither named '"
                      + project
                      + "' nor stated it is absent, while the control lookup succeeded; the"
                      " answer about this project is unproven, so no baseline may be written"
                  )
              if state == PUBLISHED:
                  with tempfile.TemporaryDirectory() as scratch:
                      return recover_from_pypi(document, Path(scratch))
              if gh_releases_present(root):
                  fail(
                      "PyPI serves nothing but this repository has GitHub Releases, which"
                      " outrank both git-archive and head; recover the baseline from the"
                      " release asset rather than letting this generator degrade past it"
                  )
              from_tag = best_tag(root)
              if from_tag is not None:
                  return from_tag
              return head_baseline(root)
          
          
          def claims_pypi(marker):
              tier, _separator, _rest = marker.partition(":")
              if tier not in KNOWN_TIERS:
                  fail(
                      "unknown baseline marker tier '"
                      + tier
                      + "'; known tiers are "
                      + ", ".join(KNOWN_TIERS)
                  )
              return tier in PYPI_TIERS
          
          
          def mirror_version(root, package):
              """``__version__`` as the package's ``__init__`` declares it, read with ast."""
              init = root / package / "__init__.py"
              if not init.is_file():
                  return None
              tree = surface.parse_module(init, False)
              for node in tree.body:
                  targets = []
                  if isinstance(node, ast.Assign):
                      targets = node.targets
                  elif isinstance(node, ast.AnnAssign):
                      targets = [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          value = node.value
                          if isinstance(value, ast.Constant) and isinstance(value.value, str):
                              return value.value
              return None
          
          
          def unambiguous_declared_version(root):
              """The version the product declares, refusing if it declares two.
          
              ``[project] version`` is canonical -- setuptools stamps it into PKG-INFO and
              into the sdist and wheel filenames -- but ``uncensorbench.__version__`` is a
              second declaration a consumer can read at runtime. While the two disagree,
              ``--current`` has no single answer, so the gate must say so rather than pick.
              """
              declared = declared_version(root)
              if not declared:
                  fail("pyproject.toml declares no [project] version")
              package = surface.resolve_package(root, None)
              mirror = mirror_version(root, package)
              if mirror is not None and mirror != declared:
                  fail(
                      "pyproject.toml declares "
                      + declared
                      + " but "
                      + package
                      + "/__init__.py declares __version__ = "
                      + mirror
                      + "; the product states two versions, so the version it declares is"
                      " ambiguous. Make them agree; do not let a check choose."
                  )
              return declared
          
          
          def main():
              here = Path(__file__).resolve().parent
              parser = argparse.ArgumentParser(
                  description="Generate released-surface.json from the best reachable artifact."
              )
              parser.add_argument("--root", type=Path, default=here.parent)
              parser.add_argument(
                  "--stdout",
                  action="store_true",
                  help="print the candidate baseline instead of writing the committed file",
              )
              parser.add_argument(
                  "--claims-pypi",
                  metavar="MARKER",
                  help="print yes or no: does this marker assert a PyPI release?",
              )
              parser.add_argument(
                  "--project-name",
                  action="store_true",
                  help="print the distribution name the manifest declares",
              )
              parser.add_argument(
                  "--declared-version",
                  action="store_true",
                  help="print the version the product declares, refusing if it declares two",
              )
              args = parser.parse_args()
          
              root = args.root.resolve()
              if args.claims_pypi:
                  print("yes" if claims_pypi(args.claims_pypi) else "no")
                  return
              if args.project_name:
                  print(resolve_project(root))
                  return
              if args.declared_version:
                  print(unambiguous_declared_version(root))
                  return
          
              baseline = generate(root)
              rendered = json.dumps(baseline, indent="  ") + "\n"
              if args.stdout:
                  sys.stdout.write(rendered)
                  return
              target = root / "released-surface.json"
              target.write_text(rendered, encoding="utf-8")
              print("baseline.py: wrote " + str(target), file=sys.stderr)
          
          
          if __name__ == "__main__":
              main()
          PYTHON

      # actions/checkout fetches one commit and no tags, so the embedded baseline generator
      # would see an empty tag list and conclude the bottom tier is the best
      # artifact available -- passing precisely because it is blind. The
      # generator reads refs (git tag, git archive, git rev-parse), so this
      # step is required even though the baseline currently sits on PyPI.
      - name: Make tags and history visible
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      # No setup-python step: the runner's python3 is used as it comes. The readers
      # need tomllib in the standard library and say so loudly if it is missing, which
      # is a visible failure rather than a silent degradation. The venv below is built
      # FROM that same interpreter, so it inherits exactly that stdlib and the property
      # is unchanged -- and every later step's python3 resolves to the venv's, which is
      # the same interpreter with the rule beside it.
      - name: Install the rule
        # Into a virtual environment, never the system interpreter. ubuntu-latest now
        # resolves to an Ubuntu whose system python3 carries the externally-managed
        # marker, so a bare `pip install` dies with
        # error: externally-managed-environment before any check runs -- a gate that can
        # never pass, worth exactly what one that can never fail is worth. The venv
        # sidesteps the marker without --break-system-packages, and putting its bin on
        # GITHUB_PATH leaves every later `autoversion` call unchanged.
        run: |
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH is read by the runner AFTER this step exits, so it does nothing
          # for the guard below. Without this prepend the guard resolves whatever
          # `autoversion` PATH already held: command-not-found on a clean runner, so
          # permanently red -- or a stranger's binary, which exits zero and vouches for a
          # rule nobody consulted. Measured both ways. This is the same prepend
          # GITHUB_PATH gives the later steps, applied to this one too.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"
          # A liveness check is not enough, because `autoversion --help` is satisfied by
          # ANY executable that exits zero. So establish WHICH autoversion is about to
          # answer. Should the prepend above ever be lost in a later edit, this refuses
          # and names the stranger rather than going green on its answer. The known-answer
          # probes in "Classify the change" then cover what that binary SAYS; this covers
          # which binary it is.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the venv this step just built, so nothing it answers would be the rule"
              false
              ;;
          esac

      # The marker is the first whitespace-delimited token of .source; the rest
      # is prose. An unknown tier is refused rather than treated as "claims
      # nothing", because a typo must not silently become the lenient branch.
      - name: Baseline marker names a known tier, and its registry claim is honest
        run: |
          set -eu
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          if [ -z "$marker" ] || [ "$marker" = null ]; then
            echo "::error::released-surface.json carries no source marker"
            false
          fi
          claims="$(python3 "$RUNNER_TEMP/version-check/baseline.py" --root "$GITHUB_WORKSPACE" --claims-pypi "$marker")"
          baseline_version="$(jq -r '.version' released-surface.json)"

          # The subject name comes from the manifest, never from a literal in
          # the URL: a renamed distribution must make this lookup follow rather
          # than leave the gate validating somebody else's project.
          project="$(python3 "$RUNNER_TEMP/version-check/baseline.py" --root "$GITHUB_WORKSPACE" --project-name)"
          if [ -z "$project" ]; then
            echo "::error::no distribution name to look up; an empty name reads as proven absence"
            false
          fi

          answer="$(curl -s "https://pypi.org/pypi/$project/json" || true)"

          # Positive control, through exactly the same URL spelling as the
          # subject. "Unproven" is also what a broken expression produces, so
          # this arm blames the check rather than the index.
          control="$(curl -s "https://pypi.org/pypi/pip/json" || true)"
          if ! printf '%s' "$control" | jq -e '.info.name' >/dev/null; then
            echo "::error::this step cannot recognise a project PyPI definitely serves, so its verdict about $project is meaningless"
            false
          fi

          served="$(printf '%s' "$answer" | jq -r '.info.version // empty')"
          if [ "$claims" = yes ]; then
            if [ -z "$served" ]; then
              echo "::error::the baseline claims a PyPI release ($marker) but the index did not name $project; the baseline is unproven"
              false
            fi
            # PyPI answers generically, so demand that it echoes the subject
            # back. Without this a lookup of the wrong name -- a bin name, a
            # stale name, a name somebody else owns -- reads as a clean answer
            # about our project when it is an answer about theirs.
            echoed="$(printf '%s' "$answer" | jq -r '.info.name // empty')"
            want_name="$(printf '%s' "$project" | tr 'A-Z' 'a-z' | tr '._' '--')"
            got_name="$(printf '%s' "$echoed" | tr 'A-Z' 'a-z' | tr '._' '--')"
            if [ "$want_name" != "$got_name" ]; then
              echo "::error::asked PyPI about '$project' and it answered about '$echoed'; this lookup is not about our distribution"
              false
            fi
            if [ "$served" != "$baseline_version" ]; then
              echo "::error::baseline was recovered from $baseline_version but PyPI now serves $served; regenerate with the embedded baseline generator"
              false
            fi
            echo "PyPI serves $project $served, matching the baseline."
          else
            if [ -n "$served" ]; then
              echo "::error::the baseline claims no PyPI release ($marker) but PyPI serves $project $served; the baseline is dodging a real release"
              false
            fi
            if ! printf '%s' "$answer" |
                 jq -e '(.message // "") | ascii_downcase | contains("not found")' >/dev/null; then
              echo "::error::the index neither named $project nor stated it is absent, so its absence is unproven"
              false
            fi
            echo "PyPI states $project is absent, consistent with $marker."
          fi

      # An honest marker on a superseded artifact is still a stale baseline.
      # Compare the whole marker on every tier except head:, whose sha moves
      # with each commit and would otherwise demand a regenerated baseline
      # forever.
      - name: Baseline sits on the best artifact reachable now
        run: |
          set -eu
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          if [ -z "$marker" ] || [ "$marker" = null ]; then
            echo "::error::released-surface.json carries no source marker, so there is no tier to compare"
            false
          fi

          # Not a pipeline. Inside "$( generator | jq )" the generator's exit
          # status is discarded and set -e does not reach into a command
          # substitution, so a generator that died would yield an empty marker
          # -- which misattributes the failure to a stale baseline and, if the
          # committed marker ever read empty too, would compare "" against ""
          # and pass vacuously.
          best_document="$RUNNER_TEMP/best-baseline.json"
          if ! python3 "$RUNNER_TEMP/version-check/baseline.py" --root "$GITHUB_WORKSPACE" --stdout > "$best_document"; then
            echo "::error::the baseline generator failed, so the best reachable artifact is unknown; this step cannot certify the committed baseline is current"
            false
          fi
          best="$(jq -r '.source | split(" ") | first' "$best_document")"
          if [ -z "$best" ] || [ "$best" = null ]; then
            echo "::error::the regenerated baseline carries no source marker, so this step has nothing to compare against"
            false
          fi
          if [ "${marker%%:*}" = head ]; then
            have="${marker%%:*}"
            want="${best%%:*}"
          else
            have="$marker"
            want="$best"
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::baseline is '$have' but '$want' is reachable now"
            false
          fi
          echo "Baseline is on the best reachable artifact: $marker"

      - name: Classify the change against the published surface
        run: |
          set -eu
          released="$(jq -r '.version' released-surface.json)"
          candidate="$RUNNER_TEMP/candidate-surface.json"
          decision="$RUNNER_TEMP/decision.json"
          python3 "$RUNNER_TEMP/version-check/surface.py" --root "$GITHUB_WORKSPACE" > "$candidate"

          autoversion decide --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$candidate" --json > "$decision"
          cat "$decision"

          # The fail-closed twin: a decision step that can no longer see a
          # change refuses nothing and looks green forever. So demand THREE
          # DIFFERENT known answers from the binary that just answered, not
          # one. A single expected answer is not enough -- a saboteur that
          # always says "internal" would satisfy a liveness check and sail
          # through the gate, because with declared == released "internal" is
          # the passing branch; one that always says "breaking" would instead
          # jam the gate red and invite someone to delete this step.
          #
          # All three probes are built from the COMMITTED baseline rather than
          # from synthetic pairs, so this step simultaneously proves that the
          # frozen file parses and that it is the file reaching the decision.
          shrunk="$RUNNER_TEMP/shrunk.json"
          grown="$RUNNER_TEMP/grown.json"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$shrunk"
          jq '{surface: (.surface + ["api:a_name_no_release_ever_had"])}' \
            released-surface.json > "$grown"
          for probe in "$shrunk:breaking" "$grown:additive" \
                       "released-surface.json:internal"; do
            path="${probe%:*}"
            expected="${probe##*:}"
            got="$(autoversion decide --current "$released" \
              --published-surface released-surface.json \
              --candidate-surface "$path" --json | jq -r '.change')"
            if [ "$got" != "$expected" ]; then
              echo "::error::this step can no longer recognise a surface change it must (expected $expected, got $got), so its verdict about the real candidate is meaningless"
              false
            fi
          done

          {
            echo "change=$(jq -r '.change' "$decision")"
            echo "required=$(jq -r '.next' "$decision")"
            echo "released=$released"
          } >> "$GITHUB_ENV"

      # Never bump inside a check. Deriving the number is mechanical; releasing
      # is deliberate.
      - name: The declared version answers for the change
        run: |
          set -eu
          declared="$(python3 "$RUNNER_TEMP/version-check/baseline.py" --root "$GITHUB_WORKSPACE" --declared-version)"
          if [ "$declared" = "$released" ]; then
            if [ "$change" = internal ]; then
              echo "Declared $declared matches the published release and nothing user-visible changed."
            else
              echo "::error::the surface change is '$change' since $released, so this tree requires $required, but it still declares $declared"
              false
            fi
          elif [ "$declared" != "$required" ]; then
            echo "::error::this tree declares $declared but the rule derives $required from a '$change' change since $released"
            false
          else
            echo "Declared $declared is the version this '$change' change requires."
          fi
